name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect e.g. v1.0.0+26.2)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release Title (leave empty for "BlockBard <tag>")'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as Draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release JAR
        run: |
          rm -rf build/libs
          ./gradlew clean build --no-daemon

      - name: Determine Tag and Release Title
        id: release_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            MOD_VERSION=$(./gradlew properties --no-daemon -q | grep "^version:" | awk '{print $2}')
            TAG="v${MOD_VERSION}"
          fi

          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="BlockBard ${TAG}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG and title: $TITLE"

      - name: Verify release artifacts exist
        run: |
          ls -la build/libs/
          COUNT=$(ls -1 build/libs/blockbard-*.jar 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "Error: No built JARs found in build/libs/"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/blockbard-*.jar
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || contains(steps.release_info.outputs.tag, '-') || contains(steps.release_info.outputs.tag, 'beta') || contains(steps.release_info.outputs.tag, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
